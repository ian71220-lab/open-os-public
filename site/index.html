      </div>
      <form id="captureForm">
        <input type="hidden" id="editingId" />
        <div class="field-grid two capture-classification">
          <label><span>類型 / Type</span>
            <select id="captureType">
              <option value="note">筆記 Note</option><option value="prompt">Prompt</option><option value="skill">Skill</option>
              <option value="video">影片 Video</option><option value="bookmark">書籤 Bookmark</option><option value="task">待辦 Task</option>
              <option value="event">行程 Event</option><option value="communication">Email / 訊息紀錄</option>
            </select>
          </label>
          <div class="category-field">
            <span class="field-caption">分類 / Category</span>
            <div class="category-control"><select id="captureCategory"></select><button type="button" class="mini-add-btn" id="categoryAddBtn">＋</button></div>
            <div class="new-category-row" id="newCategoryRow" hidden>
              <input id="newCategoryName" placeholder="新增分類名稱" />
              <input id="newCategoryColor" type="color" value="#4f7cff" aria-label="Category color" />
              <button type="button" class="secondary-btn compact" id="saveCategoryBtn">新增</button>
              <button type="button" class="text-btn" id="cancelCategoryBtn">取消</button>
            </div>
          </div>
        </div>

        <div class="generic-field"><label><span>標題 / Title</span><input id="captureTitle" /></label></div>
        <div class="generic-field"><label><span>簡介 / Description</span><textarea id="captureDescription" rows="2"></textarea></label></div>
        <div class="generic-field"><label><span id="contentText">內容 / Content</span><textarea id="captureContent" rows="7"></textarea></label></div>
        <section class="capture-images" id="captureImagesSection" aria-labelledby="captureImagesLabel">
          <div class="capture-images-head"><span class="field-label" id="captureImagesLabel">圖片 / Images</span><label class="secondary-btn compact capture-images-add"><span class="capture-images-add-icon" aria-hidden="true">＋</span><span class="capture-images-add-label">加入圖片 / Add Images</span><input id="captureImagesInput" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif,.heic,.heif" multiple /></label></div>
          <p class="field-hint">JPEG、PNG、WebP、HEIC · 每張最多 25 MB</p>
          <div class="capture-image-grid" id="captureImageGrid" aria-live="polite"></div>
        </section>
        <div class="generic-field"><div class="field-grid two"><label><span>標籤 / Tags</span><input id="captureTags" placeholder="design, threads, work" /></label><label class="check-label"><input id="captureFavorite" type="checkbox" /> ★ 收藏 / Favorite</label></div></div>

        <div id="noteFields" class="conditional-fields is-hidden"><label><span>影片連結 / Video URL</span><input id="noteVideoUrl" type="url" placeholder="YouTube / Vimeo / MP4 影片網址" /></label></div>
        <div id="promptFields" class="conditional-fields is-hidden">
          <div class="prompt-edit-section"><div class="field-label">風格參考圖片 / Style Images</div><div id="styleImageEditor" class="style-editor"></div></div>
          <div class="field-grid two">
            <label><span>新增圖片網址（每行一張）</span><textarea id="promptImageUrls" rows="4" placeholder="https://…"></textarea></label>
            <label><span>加入風格圖片（從電腦選取）</span><input id="promptImageUpload" type="file" accept="image/*" multiple /><small class="field-hint">不限制圖片比例。原始寬高、格式與檔案大小會記錄；超大原圖可能超過瀏覽器本機儲存容量。</small></label>
          </div>
        </div>
        <div id="videoFields" class="conditional-fields is-hidden">
          <div class="field-grid two"><label><span>影片 URL</span><input id="videoUrl" type="url" placeholder="YouTube / Vimeo / MP4" /></label><label><span>自訂封面 URL（選填）</span><input id="videoThumbnailUrl" type="url" placeholder="留空則自動使用 YouTube 封面" /></label></div>
          <div class="info-note">時間碼筆記可直接寫在「內容」中，例如：<strong>00:16 觀察卡片排版</strong>。詳細觀看頁會自動辨識時間碼。</div>
        </div>
        <div id="bookmarkFields" class="conditional-fields is-hidden"><label><span>URL</span><input id="bookmarkUrl" type="url" placeholder="https://…" /></label></div>
        <div id="taskFields" class="conditional-fields is-hidden"><div class="field-grid three"><label><span>到期設定</span><select id="taskDueMode"><option value="date">設定到期日</option><option value="none">無到期日</option></select></label><label><span>到期日</span><input id="taskDueDate" type="date" /></label><label><span>狀態</span><select id="taskStatus"><option value="todo">待處理</option><option value="reminder">提醒</option><option value="doing">進行中</option><option value="done">完成</option><option value="cancelled">已取消</option></select></label></div><div class="field-grid two"><label><span>優先順序</span><select id="taskPriority"><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select></label><label><span>範圍</span><select id="taskScope"><option value="work">工作</option><option value="life">生活</option></select></label></div><label><span>提醒時間（選填）</span><input id="taskReminder" type="datetime-local" /></label><small class="field-hint">可建立沒有截止日期、但只需要記住或提醒自己的事項。</small></div>
        <div id="eventFields" class="conditional-fields is-hidden">
          <div class="calendar-event-options">
            <label class="calendar-event-option"><input id="eventAllDay" type="checkbox"><span>整天活動 / All-day</span></label>
            <label class="calendar-event-option"><input id="eventCompleted" type="checkbox"><span>已完成 / Completed</span></label>
          </div>
          <div class="calendar-event-date-grid">
            <label><span>開始 / Start</span><input id="eventStart" type="datetime-local"></label>
            <label><span>結束 / End</span><input id="eventEnd" type="datetime-local"></label>
          </div>
          <label class="calendar-event-type-field"><span>類型 / Event Type</span><select id="eventType"><option value="work">工作 / Work</option><option value="personal">個人 / Personal</option></select></label>
        </div>
        <div id="communicationFields" class="conditional-fields is-hidden">
          <div class="field-grid three"><label><span>管道</span><select id="commChannel"><option>Email</option><option value="Message">訊息 / Message</option><option>Teams</option><option>Slack</option><option>Text</option><option>Phone</option><option>Other</option></select></label><label><span>方向</span><select id="commDirection"><option value="received">收到</option><option value="sent">已回覆 / 寄出</option></select></label><label><span>狀態</span><select id="commStatus"><option value="follow-up">需追蹤</option><option value="waiting">等待回覆</option><option value="done">完成</option><option value="archived">已封存</option></select></label></div>
          <div class="field-grid two"><label><span>對象</span><input id="commContact" /></label><label><span>日期時間</span><input id="commDateTime" type="datetime-local" /></label></div>
        </div>
        <section id="captureChecklist" class="capture-checklist"></section>
        <div class="modal-actions"><button type="button" class="secondary-btn" id="captureCancel">取消</button><button class="primary-btn" type="submit">儲存</button></div>
      </form>
    </section>
  </div>
