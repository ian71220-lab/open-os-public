<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f5f7">
  <title>OPEN OS 離線中</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,"Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#1d1d1f}
    @media(prefers-color-scheme:dark){:root{background:#202124;color:#f5f5f5}}
    body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{width:min(420px,100%);text-align:center;border:1px solid #d6d6d6;border-radius:20px;padding:32px;box-sizing:border-box;background:rgba(255,255,255,.72)}
    @media(prefers-color-scheme:dark){main{background:#303136;border-color:#414247}}
    img{width:72px;height:72px;object-fit:contain}h1{font-size:22px;margin:18px 0 8px}p{line-height:1.65;color:#707070;margin:0 0 22px}
    @media(prefers-color-scheme:dark){p{color:#c3c4c8}}
    a{display:inline-flex;min-height:42px;align-items:center;padding:0 18px;border-radius:12px;background:#2563eb;color:white;text-decoration:none;font-weight:600}
  </style>
</head>
<body><main>
  <img src="assets/brand/pwa-icon-192.png" alt="OPEN OS">
  <h1>目前無法連線</h1>
  <p>頁面暫時無法載入。本機展示資料仍保存在這個瀏覽器，重新連線後再試。</p>
  <a href="./">重新連線</a>
</main></body>
</html>
